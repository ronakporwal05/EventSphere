<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Password Reset Request — EventSphere AI</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f6f8; padding: 20px;">
    <div style="max-width: 600px; margin: 0 auto; background: #ffffff; padding: 30px; border-radius: 8px;">
        <h2 style="color: #4f46e5;">Password Reset OTP</h2>
        <p>You requested a password reset. Your One-Time Password (OTP) is:</p>
        <div style="font-size: 24px; font-weight: bold; letter-spacing: 4px; color: #111827; text-align: center; margin: 20px 0; background: #e0e7ff; padding: 15px; border-radius: 6px;">
            {{OTP_CODE}}
        </div>
        <p style="color: #6b7280; font-size: 12px;">This OTP will expire in 15 minutes. If you did not request this password reset, please contact security immediately.</p>
    </div>
</body>
</html>
