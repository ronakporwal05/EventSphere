name: event-sphere-ai

services:
  postgres:
    image: postgres:16-alpine
    container_name: eventsphere-postgres
    environment:
      POSTGRES_DB: eventsphere_db
      POSTGRES_USER: eventsphere
      POSTGRES_PASSWORD: eventsphere_secure_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventsphere -d eventsphere_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: eventsphere-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: eventsphere-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage


  backend:
    image: event-sphere-ai-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eventsphere-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/eventsphere_db
      SPRING_DATASOURCE_USERNAME: eventsphere
      SPRING_DATASOURCE_PASSWORD: eventsphere_secure_pass
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6334
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      GEMINI_API_KEY: ${GEMINI_API_KEY:-your_gemini_api_key_here}
      EVENTSPHERE_RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_test_TsolyDOFVBcgLq}
      EVENTSPHERE_RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-49LGSbQeYnyMQDZdKprAOtFu}
      EVENTSPHERE_ML_SERVICE_URL: http://ml-service:8000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ml-service:
    image: event-sphere-ai-ml-service:latest
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: eventsphere-ml-service
    ports:
      - "8000:8000"
    environment:
      PORT: 8000

  frontend:
    image: event-sphere-ai-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: eventsphere-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
      NEXT_PUBLIC_RAZORPAY_KEY_ID: ${NEXT_PUBLIC_RAZORPAY_KEY_ID:-rzp_test_TsolyDOFVBcgLq}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /login
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: /register
    depends_on:
      - backend

volumes:
  postgres_data:
    name: multitenant_postgres_data
    external: true
  redis_data:
    name: multitenant_redis_data
    external: true
  qdrant_data:
    name: multitenant_qdrant_data
    external: true
